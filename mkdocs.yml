site_name: Telo
site_description: Alcance, requerimientos y arquitectura de Telo
site_url: !ENV [SITE_URL, '']
repo_url: !ENV [REPO_URL, '']
repo_name: !ENV [REPO_NAME, '']
docs_dir: docs

nav:
  - Inicio: index.md
  - Documentación técnica:
      - C1 · Contexto del sistema: tecnica/c1-contexto.md
      - C2 · Contenedores: tecnica/c2-contenedores.md
      - Diseño del dominio y datos: tecnica/dominio-v1.md

theme:
  name: material
  language: es
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - toc:
      permalink: true

plugins:
  - search:
      lang: es
